services:
  - type: web
    name: seaguard
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/model-info
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
